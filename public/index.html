<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard Pengurusan Calon</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/gaya.css">
<script type="module" src="/assets/dashboard.js"></script>
</head>
<body>
<header class="header">
  <div class="header-dalam">
    <div class="header-baris">
      <div class="jenama">
        <div class="lencana" id="lencana">N15</div>
        <div>
          <h1 id="tajuk">Dashboard Pengurusan Calon</h1>
          <div class="subtajuk" id="subtajuk"></div>
        </div>
      </div>
      <div class="alat">
        <div class="tukar-dun" role="group" aria-label="Pilih DUN">
          <a href="/" id="pautan-n15">N.15 Taman Templer</a>
          <a href="/kuang" id="pautan-n13">N.13 Kuang</a>
        </div>
        <button type="button" class="btn-hantu" id="muat-semula">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"></path><path d="M21 3v5h-5"></path></svg>
          Muat semula
        </button>
        <a class="btn-hantu" href="/admin">Admin</a>
        <button type="button" class="btn-hantu" id="log-keluar">Log keluar</button>
      </div>
    </div>
    <nav class="nav" aria-label="Bahagian dashboard">
      <a href="#ringkasan">Ringkasan</a>
      <a href="#udm">UDM</a>
      <a href="#jadual" id="nav-jadual">Jadual Operasi</a>
    </nav>
  </div>
</header>

<main class="utama" id="ringkasan">
  <div class="memuat" id="memuat">Memuatkan data dari Google Sheet…</div>
  <div id="ralat" class="notis merah tersembunyi" role="alert"></div>
  <div id="pengumuman" class="notis kuning tersembunyi"></div>

  <section class="kpi tersembunyi" id="kpi" aria-label="Angka utama"></section>
  <div id="tak-padan" class="tersembunyi"></div>

  <section id="udm" class="tersembunyi" style="display:flex;flex-direction:column;gap:16px">
    <div class="seksyen-kepala">
      <div>
        <h2>Unit Daerah Mengundi</h2>
        <div class="kecil">Tekan kad untuk lihat senarai penuh ziarah, Al Malak dan komuniti</div>
      </div>
      <label class="cari">
        <span class="sr">Cari UDM atau cawangan</span>
        <span aria-hidden="true" class="kecil" id="ikon-cari"></span>
        <input type="search" id="cari" placeholder="Cari UDM atau cawangan…">
      </label>
    </div>
    <div class="penapis" id="penapis" role="group" aria-label="Tapis UDM"></div>
    <div class="grid-udm" id="grid-udm"></div>
    <div class="kosong tersembunyi" id="tiada-udm">Tiada UDM sepadan.</div>
  </section>

  <section id="jadual" class="tersembunyi" style="display:flex;flex-direction:column;gap:14px">
    <div class="seksyen-kepala">
      <div>
        <h2>Jadual Operasi</h2>
        <div class="kecil" id="jadual-ringkas"></div>
      </div>
      <button type="button" class="btn kedua kecil" id="semua-jadual">Tunjuk semua</button>
    </div>
    <div class="panel kotak-jadual"><table id="jadual-tbl"></table></div>
  </section>

  <footer class="kaki" id="kaki"></footer>
</main>
</body>
</html>
